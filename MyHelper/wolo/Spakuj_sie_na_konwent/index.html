<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyHelper – Spakuj się na konwent</title>
<style>
:root{--k:#0b0d0c;--ink:#14201a;--mut:#6b756f;--line:#e4e2d9;--sb:#ecebe4;--gd:#1f4d38;--g:#2d5a43;--gt:#e1ebe5;--o:#d97a2b;--ot:#fbe9d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;color:var(--ink);font:15px/1.45 system-ui,sans-serif}html{background:var(--k)}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
*{box-sizing:border-box}[hidden]{display:none!important}
#app{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
#app:has(.shell){display:block}
h1,h2{margin:0}h1{font-size:2rem}p{margin:0;color:var(--mut);font-size:.9rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;width:100%;max-width:520px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.btn{font:inherit;font-weight:600;font-size:.9rem;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.btn.g{background:var(--gd);border-color:var(--gd);color:#fff}
.btn.x{background:transparent}.btn.s{padding:4px 12px}a.btn,a.nv{text-decoration:none}a.btn{text-align:center}
.btn:hover,.btn:focus-visible{outline:2px solid var(--o);outline-offset:1px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--mut)}
input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input:focus,select:focus{outline:2px solid var(--gt);border-color:var(--g)}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--o)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.9rem;color:var(--ink);font-weight:500;cursor:pointer}
.chips input{accent-color:var(--g)}.chips label:has(input:checked){background:var(--gt);border-color:var(--g)}
.drop{position:relative;border:1.5px dashed var(--g);border-radius:14px;padding:22px;text-align:center;color:var(--mut)}.drop:hover,.drop:focus-within{border-color:var(--o);background:var(--ot)}.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
#m{color:#b4540f;min-height:1.2em;font-size:.85rem}
.logo{font-weight:800;display:flex;align-items:center;gap:10px;padding:6px 6px 10px;font-size:1.05rem}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--gd) 55%,var(--o) 55%)}
.shell{display:grid;grid-template-columns:232px 1fr;gap:12px;background:var(--sb);border-radius:24px;padding:12px;max-width:1180px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.shell aside{padding:6px;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}
.lb{font-size:.7rem;letter-spacing:.08em;color:var(--mut);padding:10px 12px 2px;text-transform:uppercase}
.nv{font:inherit;background:none;border:0;text-align:left;padding:8px 12px;border-radius:10px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.nv:hover{background:#e2e0d6}.nv.on{background:#fff;font-weight:600;color:var(--gd)}
.ai{margin-top:12px;background:linear-gradient(160deg,#14291f,var(--gd));color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}.ai p{color:#cfe0d6;font-size:.82rem}
.m{background:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.hd h2{font-size:1.4rem}.row2{display:flex;gap:8px;flex-wrap:wrap}
.sub{color:var(--mut);font-size:.82rem}.sub:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#3aa86b;margin-right:6px}
.k{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}.k small{color:var(--mut);font-weight:600}
.big{font-size:2.1rem;font-weight:700;line-height:1}.big em{font-style:normal;font-size:1rem;color:var(--mut);font-weight:500}
.pill,.ch b{align-self:flex-start;background:var(--gt);color:var(--gd);border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:600}
progress{width:100%;height:8px;accent-color:var(--o)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.card>label{flex-direction:row;align-items:center;gap:10px;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:.95rem;color:var(--ink);font-weight:400}.card>label:hover{background:#f6f5ef}
input:checked+span{text-decoration:line-through;color:var(--mut)}
.card input:not([type=checkbox]){width:100%}.card .n{font-weight:700}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.card li{display:flex;gap:6px}
@media(max-width:800px){.shell{grid-template-columns:1fr}.shell aside{position:static}.grp{display:none}}
.by{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--mut);margin-top:6px}.by b{display:block;color:var(--ink);font-size:.88rem}.by img{width:72px;border-radius:8px}
footer{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;color:var(--mut);font-size:.75rem;display:flex;flex-direction:column;gap:4px}footer p{font-size:inherit}
</style></head><body>
<canvas id="bg"></canvas><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),cv=$('#bg'),cx=cv.getContext('2d');
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt()+';');
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let data=ld('data'),checked=ld('checked')||{},draft=null,step='m';
const go=h=>location.hash=h,dflt=()=>({title:'Moja lista',groups:[{name:'Grupa 1',items:['']}]});
const logo='<div class=logo><i></i>MyHelper</div>';

const by='<div class=by><img src="logo_kapitan.jpg" alt="Kapitan Fandom"><span>Powstało w kooperacji z<b>Kapitanem Fandomem</b></span></div>';
const foot='<footer><p>Wydawca: inicjatywa MyHelper, we współpracy z Kapitanem Fandomem.</p><p>Lista ma charakter pomocniczy i informacyjny. Sprawdź wymagania organizatora konwentu (np. zgoda opiekuna prawnego, regulamin) oraz własne potrzeby zdrowotne – korzystasz na własną odpowiedzialność.</p><p>Prywatność: strona nie ma kont ani analityki i nie wysyła Twoich danych na serwer. Lista i zaznaczenia są zapisywane wyłącznie w Twojej przeglądarce (localStorage).</p><p>Logotypy i nazwy należą do ich właścicieli.</p></footer>';

/* --- dither gradient (Bayer 4x4), czerń → zieleń → pomarańcz --- */
const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],P=['#0b0d0c','#2d5a43','#d97a2b'].map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);let raf;
function fit(){cv.width=Math.ceil(innerWidth/4);cv.height=Math.ceil(innerHeight/4)}
function frame(t=0){cancelAnimationFrame(raf);const w=cv.width,h=cv.height,im=cx.createImageData(w,h),d=im.data,T=t/1000*.4;
 for(let y=0,k=0;y<h;y++)for(let x=0;x<w;x++,k+=4){
  let p=(x/w+y/h)/2*.95+.06*Math.sin(x/w*6+T)+.05*Math.sin(y/h*5-T*1.3);
  p=Math.round(Math.min(1,Math.max(0,p+(B[(y&3)*4+(x&3)]/16-.5)*.3))*4)/4;
  const c=p<.5?mix(P[0],P[1],p*2):mix(P[1],P[2],(p-.5)*2);d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255}
 cx.putImageData(im,0,0);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)raf=requestAnimationFrame(frame)}
addEventListener('resize',()=>{fit();frame()});fit();frame();

/* --- dane --- */
const s=(v,m)=>String(v??'').trim().slice(0,m);
function clean(o){if(!o||!Array.isArray(o.groups))return null;
 return{title:s(o.title,80)||'Moja lista',groups:o.groups.slice(0,50).map(g=>({name:s(g?.name,60)||'Grupa',items:(Array.isArray(g?.items)?g.items:[]).slice(0,200).map(i=>s(i,120)).filter(Boolean)}))}}
console.assert(clean({title:1,groups:[{name:'a',items:['x',' ']}]}).groups[0].items.length==1,'clean');
/* szablon wg listy konwentowej; o = zaznaczone opcje */
function build(n,r,sl,o){const g=[],G=(name,items)=>g.push({name,items}),h=x=>o.includes(x);
 G('Dokumenty i pieniądze',['Dowód osobisty',...(h('min')?['Zgoda opiekuna prawnego (dla niepełnoletnich)']:[]),'Legitymacja szkolna / studencka','Bilet na wydarzenie',h('car')?'Prawo jazdy i dowód rejestracyjny':'Bilet na pociąg / autobus / samolot','Pieniądze (gotówka)','Karta płatnicza']);
 G('Ubrania',['Koszulki / sukienki ×'+n,'Spodnie / spódnice ×'+Math.ceil(n/2),'Bielizna ×'+n,'Skarpetki ×'+n,'Kurtka / bluza','Buty (wygodne!)','Coś na głowę (czapka, kapelusz, chusta)']);
 G('Elektronika',['Telefon','Ładowarka do telefonu','Powerbank','Słuchawki','Głośnik',...(h('cam')?['Aparat / kamera (+ ładowarka, obiektywy)']:[])]);
 if(h('cos'))G('Dla cosplayerów',['Cosplay','Czepek pod perukę','Zestaw do szycia','Pistolet z klejem na gorąco','Agrafki']);
 G('Zdrowie i higiena',['Apteczka (plastry, bandaże)','Leki stałe przyjmowane','Tabletki przeciwbólowe','Leki na biegunkę','Węgiel aktywny','Podpaski / tampony','Mydło / żel pod prysznic','Szczoteczka i pasta do zębów','Szampon / suchy szampon','Dezodorant','Żel antybakteryjny','Chusteczki (suche i mokre)']);
 if(h('sun')||h('rain'))G('Zależne od pogody',[...(h('sun')?['Krem z filtrem UV','Okulary przeciwsłoneczne','Wachlarz']:[]),...(h('rain')?['Parasol','Kurtka / płaszcz przeciwdeszczowy']:[])]);
 if(sl!='d')G('Zależne od noclegu',sl=='h'?['Potwierdzenie rezerwacji','Ręcznik','Klapki','Stopery do uszu']:[...(sl=='t'?['Namiot']:[]),'Śpiwór','Karimata / materac','Poduszka','Ręcznik','Klapki','Stopery do uszu','Opaska na oczy']);
 if(r=='w')G('Wolontariat',['Identyfikator / koszulka wolontariusza','Grafik zmian','Kontakt do koordynatora','Przekąski na zmianę']);
 if(r=='e')G('Stoisko',['Potwierdzenie wystawcy','Materiały promocyjne','Wizytówki','Baner / roll-up','Przedłużacz i listwa','Nożyczki, opaski zaciskowe','Terminal płatniczy i drobne','Towar / próbki']);
 if(h('car'))G('Auto',['Ubezpieczenie OC','Parking / przepustka','Nawigacja']);
 G('Inne',['Plecak / torba na zakupy','Jedzenie (np. suchy prowiant)','Woda (najlepiej w butelce z filtrem)','Coś do pisania (długopis, ołówek, marker)','Zeszyt','Taśma klejąca']);
 return{title:`Lista: ${n} ${n==1?'dzień':'dni'} · ${{u:'uczestnik',w:'wolontariusz',e:'wystawca'}[r]}${h('cos')?' · cosplay':''}`,groups:g}}

/* --- widoki --- */
function home(){let h;
 if(step=='b')h=`${logo}<h2>Wbudowany szablon</h2><form id=f style="display:contents">
  <label>Na ile dni<input name=n type=number min=1 value=2 required></label>
  <label>Kim jesteś<select name=r><option value=u>Uczestnik</option><option value=w>Wolontariusz</option><option value=e>Wystawca</option></select></label>
  <label>Nocleg<select name=s><option value=d>Dojeżdżam codziennie</option><option value=h>Hotel / hostel</option><option value=p>Sala noclegowa na miejscu</option><option value=t>Namiot</option></select></label>
  <div class=chips>${[['cos','Robię cosplay'],['min','Jestem niepełnoletni/a'],['cam','Biorę aparat'],['car','Jadę autem'],['sun','Słońce'],['rain','Deszcz']].map(([v,t])=>`<label><input type=checkbox name=o value=${v}>${t}</label>`).join('')}</div>
  <button class="btn g">Generuj listę</button></form><button class="btn x" data-a=step data-v=m>← Wróć</button>`;
 else if(step=='o')h=`${logo}<h2>Własny szablon</h2><button class="btn g" data-a=new>Stwórz własny</button>
  <div class=drop>Upuść plik .json tutaj<br><small>lub kliknij, by wybrać</small><input id=fi type=file accept=".json,application/json"></div>
  <div id=m></div><button class="btn x" data-a=step data-v=m>← Wróć</button>`;
 else h=`${logo}<h1>Spakuj się na konwent</h1><p>Inicjatywa MyHelper. Lista rzeczy do zabrania na konwent. Zacznij od szablonu.</p>
  <button class="btn g" data-a=step data-v=b>Wbudowany szablon</button><button class=btn data-a=step data-v=o>Własny szablon</button>
  ${data?'<a class="btn x" href=#/lista>Wróć do ostatniej listy</a>':''}`;
 app.innerHTML=`<div class=panel>${h}${by}${foot}</div>`}
function lista(){if(!data)return go('#/');
 const gs=data.groups;
 app.innerHTML=`<div class=shell><aside>${logo}<div class=lb>Przegląd</div><button class="nv on">Lista</button><button class=nv data-a=edit>Kreator</button><a class=nv href=#/>Start</a>
  <div class=lb>Szukaj</div><input id=q placeholder="Szukaj rzeczy…"><div class="lb grp">Grupy</div>
  ${gs.map((g,i)=>`<button class="nv grp" data-a=sc data-i=${i}>${esc(g.name)}</button>`).join('')}
  ${by}</aside>
  <div class=m><div class=hd><div><h2>${esc(data.title)}</h2><div class=sub>Zapisuje się automatycznie</div></div>
  <div class=row2><button class=btn data-a=reset>Odznacz wszystko</button><button class="btn g" data-a=edit>Edytuj</button></div></div>
  <div class=k><small>Spakowano</small><div class=big id=s1></div><span class=pill id=s1p></span><progress id=pb max=100></progress></div>
  <div class=gr>${gs.map((g,i)=>`<div class=card id=g${i}><div class=ch>${esc(g.name)}<b></b></div>${g.items.map((t,j)=>`<label><input type=checkbox data-k="${i}-${j}"${checked[i+'-'+j]?' checked':''}><span>${esc(t)}</span></label>`).join('')}</div>`).join('')}</div>${foot}</div></div>`;
 prog()}
function prog(){let all=0,d=0;
 document.querySelectorAll('.card').forEach(c=>{const t=c.querySelectorAll('input').length,k=c.querySelectorAll('input:checked').length;all+=t;d+=k;c.querySelector('.ch b').textContent=k+'/'+t});
 const p=all?Math.round(d/all*100):0;
 $('#s1').innerHTML=`${d}<em> / ${all}</em>`;$('#s1p').textContent=p+'% gotowe';$('#pb').value=p}
function creator(){draft=draft||dflt();
 app.innerHTML=`<div class=shell><aside>${logo}<div class=lb>Przegląd</div><a class=nv href=#/>Start</a>${data?'<a class=nv href=#/lista>Lista</a>':''}<button class="nv on">Kreator</button>
  <div class=lb>Tytuł</div><input id=t value="${esc(draft.title)}"><button class=btn data-a=addg style="margin-top:8px">+ Dodaj grupę</button><div id=m></div>
  <div class=ai><b>Zapisz do pliku</b><p>Plik .json wczytasz potem na stronie startowej.</p><button class=btn data-a=dl>Pobierz .json</button></div>${by}</aside>
  <div class=m><div class=hd><div><h2>Kreator</h2><div class=sub>Projektuj własną listę</div></div><button class="btn g" data-a=open>Otwórz listę</button></div>
  <div class=gr>${draft.groups.map((g,i)=>`<div class=card><input class=n data-g=${i} value="${esc(g.name)}" placeholder="Nazwa grupy">
  <ul>${g.items.map((t,j)=>`<li><input data-g=${i} data-i=${j} value="${esc(t)}" placeholder="Rzecz do zabrania"><button class="btn x s" data-a=deli data-g=${i} data-i=${j}>×</button></li>`).join('')}</ul>
  <div class=row2><button class="btn s" data-a=addi data-g=${i}>+ Pozycja</button><button class="btn x s" data-a=delg data-g=${i}>Usuń grupę</button></div></div>`).join('')}</div>${foot}</div></div>`}
const setData=d=>{data=d;checked={};sv('data',d);sv('checked',checked)};
const msg=t=>{const m=$('#m');if(m)m.textContent=t};
function file(f){const r=new FileReader();r.onload=()=>{try{const d=clean(JSON.parse(r.result));if(!d)throw 0;setData(d);go('#/lista')}catch{msg('Nieprawidłowy plik – potrzebny .json z listą.')}};r.readAsText(f.slice(0,1e6))}
const addItem=g=>{draft.groups[g].items.push('');creator();document.querySelectorAll('.card')[g].querySelector('li:last-child input').focus()};

/* --- zdarzenia --- */
app.onclick=async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const{a,v}=b.dataset,g=+b.dataset.g,i=+b.dataset.i;
 if(a=='step'){step=v;home()}
 else if(a=='new'){draft=dflt();go('#/creator')}else if(a=='edit'){draft=structuredClone(data);go('#/creator')}
 else if(a=='sc')$('#g'+i)?.scrollIntoView({behavior:'smooth'})
 else if(a=='reset'){checked={};sv('checked',checked);lista()}
 else if(a=='addg'){draft.groups.push({name:'Nowa grupa',items:['']});creator()}
 else if(a=='delg'){draft.groups.splice(g,1);creator()}else if(a=='deli'){draft.groups[g].items.splice(i,1);creator()}
 else if(a=='addi')addItem(g)
 else if(a=='open'){setData(clean(draft));go('#/lista')}
 else if(a=='dl'){const j=JSON.stringify(clean(draft),null,1),d=window.claude?.use&&await claude.use('downloads');
  if(d)try{await d.save({filename:'lista.json',data:j})}catch{msg('Zapis anulowany.')}
  else{const u=URL.createObjectURL(new Blob([j],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='lista.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1e4);msg('Pobrano lista.json')}}};
app.oninput=e=>{const t=e.target;
 if(t.id=='q'){const v=t.value.toLowerCase();return document.querySelectorAll('.card>label').forEach(l=>l.hidden=!l.textContent.toLowerCase().includes(v))}
 if(t.id=='t')draft.title=t.value;else if(t.dataset.g!=null)t.dataset.i!=null?draft.groups[+t.dataset.g].items[+t.dataset.i]=t.value:draft.groups[+t.dataset.g].name=t.value};
app.onchange=e=>{const t=e.target;if(t.dataset.k){checked[t.dataset.k]=t.checked;sv('checked',checked);prog()}else if(t.id=='fi'&&t.files[0])file(t.files[0])};
app.onkeydown=e=>{if(e.key=='Enter'&&e.target.dataset.i!=null){e.preventDefault();addItem(+e.target.dataset.g)}};
app.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),n=Math.max(1,+f.get('n')||1);
 setData(build(n,f.get('r'),f.get('s'),f.getAll('o')));go('#/lista')};

function route(){const f={'#/lista':lista,'#/creator':creator}[location.hash];f?(step='m',f()):home()}
addEventListener('hashchange',route);route();
</script></body></html>
